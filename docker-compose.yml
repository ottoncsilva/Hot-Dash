# =========================================================================
# Hot Dash — sobe só o app. A censura por IA (NudeNet) agora roda EMBUTIDA
# no próprio app (modelo 320n.onnx via onnxruntime-node), então NÃO precisa
# de serviço externo nem de configurar URL nenhuma:
#
#   docker compose up -d --build
#
# O serviço `nudenet` separado (abaixo, comentado) virou OPCIONAL/legado —
# use só se quiser rodar a detecção fora do app. Para isso, descomente o
# bloco e defina NUDENET_URL no app (ou pela tela Configurações → IA).
# =========================================================================

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # environment:
    #   # Só se for usar o serviço NudeNet externo (opcional; veja abaixo).
    #   NUDENET_URL: http://nudenet:8000
    #   NUDENET_API_KEY: troque-por-um-token
    ports:
      - "3000:3000"
    volumes:
      - hotdash-data:/app/data

  # --- Chip do Telegram (LTV por conta real) ------------------------------
  # Só precisa se for usar o LTV do Telegram. Exige api_id/api_hash do
  # my.telegram.org (ver telegram-mtproto-service/README.md). Depois de subir,
  # informe a URL e o token em Configurações → Conexão com IA.
  # telegram-chip:
  #   build: ./telegram-mtproto-service
  #   restart: unless-stopped
  #   environment:
  #     TELEGRAM_API_ID: "0000000"
  #     TELEGRAM_API_HASH: "troque-pelo-seu"
  #     CHIP_API_TOKEN: troque-por-um-token
  #     WEBHOOK_URL: https://painel.seudominio.com/api/webhooks/telegram-chip
  #   expose:
  #     - "8100"
  #   volumes:
  #     # NÃO é opcional: sem o volume, todo deploy pede o código do Telegram
  #     # de novo — e pedir código demais derruba o chip.
  #     - telegram-chip-data:/data

  # --- OPCIONAL / legado: serviço NudeNet externo -------------------------
  # Descomente se preferir rodar a detecção fora do app (o embutido já cobre
  # o caso normal). Lembre de descomentar NUDENET_URL no app acima.
  # nudenet:
  #   build: ./nudenet-service
  #   restart: unless-stopped
  #   # environment:
  #   #   NUDENET_API_KEY: troque-por-um-token
  #   expose:
  #     - "8000"

volumes:
  hotdash-data:
  telegram-chip-data:
