  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#070708" />
    <title>Hot Dash · sem conexão</title>
    <!--
      A tela de SEM CONEXÃO do app instalado.

      HTML puro, sem uma linha de JavaScript e sem nenhum arquivo de fora, de
      propósito: é a única página que precisa funcionar justamente quando nada
      carrega. O painel é feito de pedaços com hash no nome (Next.js), e o
      service worker não tem como guardar todos — guardar só a casca fazia o
      app abrir numa tela branca quebrada, que é pior que dizer a verdade.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom));
        background: #070708;
        color: #e4e4e7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .caixa { max-width: 22rem; }
      .marca {
        display: inline-flex;
        height: 3.5rem;
        width: 3.5rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.875rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
      }
      .marca img { height: 2rem; width: 2rem; border-radius: 0.5rem; }
      h1 { margin: 1.25rem 0 0; font-size: 1.125rem; font-weight: 600; color: #fff; }
      p { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.6; color: #a1a1aa; }
      .dica { margin-top: 0.75rem; font-size: 0.75rem; color: #71717a; }
      a.botao {
        display: inline-block;
        margin-top: 1.5rem;
        border-radius: 0.5rem;
        background: #10b981;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 700;
        color: #04140d;
        text-decoration: none;
      }
      a.botao:active { background: #059669; }
    </style>
  </head>

      <h1>Sem conexão</h1>
      <p>
        O Hot Dash lê tudo do servidor — venda, mensagem, agenda. Sem internet não há o que
        mostrar, e um número velho na tela seria pior que nenhum.
      </p>
      <p class="dica">Confira o Wi-Fi ou os dados e tente de novo.</p>
